constructor-name: "newMock{{ . }}"
package-name: "{{ . }}"
output: "{{ . }}.gen_test.go"
interfaces:
  - name: Some
    field-overwriter-param:
      - Slice.rows=elementsMatch
      - SetX.x=oneOf
      - Anything.v=any
    rename-returns:
      GetX.r0: X
      Multi.r0: X
      Multi.r1: Y
  - name: Embedded
  - name: Handler
    rename-returns:
      Handler.r0: Result
  - name: Ticker
  - name: Filter
    field-overwriter-param:
      - Filter.rows=elementsMatch
      - Filter.mode=oneOf
      - Filter.ignored=any
